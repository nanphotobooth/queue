<!DOCTYPE html>
<html lang="th">
<head>
<base target="_top">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nan Photo Booth · ทีมงาน</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;1,400&family=Anuphan:wght@400;500;600;700&family=IBM+Plex+Sans+Thai:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  :root{--bg:#f6f3ec;--card:#fff;--ink:#1f1b16;--muted:#6f675c;--line:#e4dccd;--brand:#f2b632;--ok:#2f7d4f;--ok-bg:#e6f4ea;--warn:#a35a00;--warn-bg:#fdecc8;--bad:#a1321f;--bad-bg:#fde8e4;--off:#8a8378;--off-bg:#eeeae2}
  *{box-sizing:border-box}
  html,body{margin:0}
  body{background:var(--bg);color:var(--ink);font-family:'IBM Plex Sans Thai',system-ui,sans-serif;font-size:16px;line-height:1.5}
  .wrap{max-width:720px;margin:0 auto;padding:14px 14px 96px}
  h1{font-family:'Playfair Display','Noto Serif Thai',serif;font-weight:400;font-size:26px;margin:0}
  h2{font-size:15px;font-weight:600;color:var(--muted);margin:22px 2px 8px}
  .top{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px}
  .who{font-size:13px;color:var(--muted);text-align:right}
  .who button{border:0;background:none;color:inherit;text-decoration:underline;font:inherit;cursor:pointer;padding:6px 0}
  .tabs{display:flex;background:var(--off-bg);border-radius:12px;padding:4px;gap:2px}
  .tabs{overflow-x:auto}
  .tabs button{flex:1 0 auto;white-space:nowrap;border:0;background:transparent;font:inherit;font-weight:500;padding:10px 10px;border-radius:9px;color:var(--muted);cursor:pointer}
  .tabs button.on{background:#fff;color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08)}
  .stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
  .stat{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 12px}
  .stat b{display:block;font-size:22px;font-weight:600;font-variant-numeric:tabular-nums}
  .stat span{font-size:12px;color:var(--muted)}
  input,select,textarea{font:inherit;color:inherit;width:100%;min-height:46px;border:1px solid var(--line);border-radius:10px;padding:8px 12px;background:#fff}
  textarea{min-height:76px;resize:vertical}
  input:focus,select:focus,textarea:focus,button:focus-visible{outline:2px solid var(--ink);outline-offset:1px}
  .search{margin-top:12px}
  .card{display:block;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-bottom:8px;font:inherit;color:inherit;cursor:pointer}
  .card .r1{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
  .card .when{font-weight:600}
  .card .cust{margin-top:2px}
  .card .meta{font-size:13px;color:var(--muted)}
  .chip{display:inline-block;font-size:12px;font-weight:600;border-radius:999px;padding:2px 9px;white-space:nowrap}
  .chip.ok{background:var(--ok-bg);color:var(--ok)} .chip.warn{background:var(--warn-bg);color:var(--warn)} .chip.off{background:var(--off-bg);color:var(--off)} .chip.bad{background:var(--bad-bg);color:var(--bad)}
  .miss{font-size:13px;color:var(--warn);margin-top:4px}
  .empty{color:var(--muted);text-align:center;padding:22px 0}
  .fab{position:fixed;right:16px;bottom:18px;min-height:52px;padding:0 20px;border-radius:26px;border:0;background:var(--ink);color:#fff;font:inherit;font-weight:600;box-shadow:0 6px 18px rgba(0,0,0,.22);cursor:pointer}
  .btn{min-height:48px;border-radius:12px;font:inherit;font-weight:600;border:1px solid var(--ink);background:#fff;color:var(--ink);padding:0 16px;cursor:pointer}
  .btn.primary{background:var(--ink);color:#fff}
  .btn.danger{border-color:var(--bad);color:var(--bad)}
  .btn:disabled{opacity:.5}
  .login{max-width:340px;margin:12vh auto 0;text-align:center}
  .login img{width:150px;margin-bottom:14px}
  .linkbtn{display:block;width:100%;border:0;background:none;font:inherit;font-size:14px;color:var(--ink);text-decoration:underline;cursor:pointer;padding:12px 0 2px}
  .msg{border-radius:10px;padding:10px 12px;font-size:14px;margin:10px 0}
  .msg.bad{background:var(--bad-bg);color:var(--bad)} .msg.ok{background:var(--ok-bg);color:var(--ok)}
  dialog{border:0;padding:0;width:100%;max-width:640px;max-height:100dvh;height:100dvh;margin:0 auto;background:var(--bg)}
  dialog::backdrop{background:rgba(0,0,0,.35)}
  .sheet{padding:14px 14px 28px}
  .sheet .bar{display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;background:var(--bg);padding:6px 0 10px;z-index:1}
  .f{display:grid;grid-template-columns:1fr 1fr;gap:10px 10px}
  .f label{font-size:13px;color:var(--muted);display:block}
  .f label>span{display:block;margin-bottom:3px}
  .f .full{grid-column:1/-1}
  .f .check{display:flex;align-items:center;gap:10px;min-height:46px;font-size:16px;color:var(--ink)}
  .f .check input{width:22px;min-height:22px;height:22px}
  fieldset{border:1px solid var(--line);border-radius:14px;background:var(--card);padding:12px;margin:0 0 12px}
  legend{font-weight:600;font-size:14px;padding:0 6px}
  .quote{font-size:13px;color:var(--muted);grid-column:1/-1}
  .quote button{border:0;background:none;text-decoration:underline;font:inherit;color:var(--ink);cursor:pointer;padding:6px 0}
  .actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:6px}
  .tx{display:flex;justify-content:space-between;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:9px 12px;margin-bottom:6px;font-size:14px}
  .tx b{white-space:nowrap;font-variant-numeric:tabular-nums}
  .tx .in{color:var(--ok)} .tx .out{color:var(--bad)}
  .exp{display:grid;grid-template-columns:1.1fr 1.6fr .9fr;gap:6px;margin-bottom:6px}
  .js h2{margin:14px 0 4px;color:var(--ink);font-size:15px}
  .js label.check{display:flex;gap:10px;align-items:center;font-size:15px;margin:6px 0}
  .js label.check input{width:22px;min-height:22px;height:22px}
  @media print{ body>.wrap{display:none} dialog{position:static;height:auto;max-height:none} .noprint{display:none!important} }
  .bar-row{display:grid;grid-template-columns:5.5em 1fr auto;gap:8px;align-items:center;font-size:13px;margin:5px 0}
  .bar-row i{display:block;height:14px;border-radius:4px;background:var(--ink);min-width:2px}
  .bar-row b{font-variant-numeric:tabular-nums;white-space:nowrap}
  .rk{width:100%;border-collapse:collapse;font-size:14px}
  .rk td{padding:6px 0;border-bottom:1px solid var(--line)} .rk td:last-child{text-align:right;font-variant-numeric:tabular-nums;font-weight:600}
  .slip{display:block;max-width:100%;max-height:70vh;margin:0 auto 10px;border-radius:10px;border:1px solid var(--line)}
  .ro{font-size:14px;margin:0}
  .ro dt{color:var(--muted);font-size:12px;margin-top:8px}
  .ro dd{margin:0}
  .actions.three{grid-template-columns:1fr 1fr 1fr}
  .chk{white-space:pre-line;font-size:13px;border-radius:10px;padding:9px 11px;margin:0 0 10px;border:1px solid var(--line);background:var(--card)}
  .chk.ok{border-color:var(--ok)} .chk.warn{border-color:var(--warn,#b7791f)}
  .tx .ed{border:0;background:none;font:inherit;font-size:12px;text-decoration:underline;color:var(--muted);cursor:pointer;padding:6px 8px 6px 0;min-height:32px}
  .rp{font-size:13px} .rp h2{font-size:15px;margin:16px 0 6px;color:var(--ink)} .rp h1{font-size:19px;margin:0}
  .rp table{width:100%;border-collapse:collapse;font-size:12px} .rp th,.rp td{border-bottom:1px solid var(--line);padding:5px 6px 5px 0;text-align:left;vertical-align:top}
  .rp th{font-weight:600;border-bottom:2px solid var(--ink)} .rp .n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap} .rp tfoot td{font-weight:600;border-top:2px solid var(--ink);border-bottom:0}
  .rp .sumgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:10px 0} .rp .sumgrid div{border:1px solid var(--line);border-radius:10px;padding:8px 10px} .rp .sumgrid b{display:block;font-size:16px;font-variant-numeric:tabular-nums}
  .rp .tw{overflow-x:auto}
  @media print{ @page{size:A4;margin:12mm} .rp{font-size:11px} .rp table{font-size:10px} .rp .tw{overflow:visible} .rp tr{break-inside:avoid} dialog{border:0;box-shadow:none;width:auto;max-width:none;padding:0} dialog::backdrop{display:none} .sheet{padding:0} }
  .blockrow{display:flex;justify-content:space-between;align-items:center;gap:8px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:8px}
  .blockrow button{border:0;background:none;color:var(--bad);font:inherit;text-decoration:underline;cursor:pointer;min-height:44px}
</style>
</head>

    var showQuote=function(apply){ var q=quote(cur()); qline.innerHTML=''; if(!money) return; if(!q){ qline.textContent='ไม่มีราคาในตารางสำหรับจำนวนชั่วโมงนี้ กรอกราคาเอง'; return; }
      if(apply){ ['price','travel','extra','total','deposit'].forEach(function(k){ F[k].value=q[k]; }); }
      qline.appendChild(document.createTextNode('ราคาตามตาราง: รวม '+fmt(q.total)+' บาท · มัดจำ '+fmt(q.deposit)+' บาท '));
      if(!ro) qline.appendChild(el('button',{type:'button',text:'ใช้ราคานี้',onclick:function(){ showQuote(true); }})); };
    var backdropHint=el('div',{class:'quote'});
    var hint=function(){ backdropHint.textContent = F.service.value==='Video Guestbook' ? '' : (+F.hours.value>=4 ? 'จอง 4 ชั่วโมงขึ้นไป ระบุสีฉากหรือฉากพิเศษได้ (มูลค่าไม่เกิน 3,000 บาท)' : 'จอง 2–3 ชั่วโมง เลือกได้ ครีม หรือ เทาเข้ม'); };

    sheet.appendChild(el('div',{class:'bar'},[ el('h1',{text:isNew?'เพิ่มคิว':(b.id||'คิวงาน')}), el('button',{class:'btn',type:'button',text:'ปิด',onclick:function(){ $('dlg').close(); }}) ]));
    if(!isNew&&b.status==='รอตรวจมัดจำ') sheet.appendChild(reviewBox(b));
    if(!isNew&&(b.status==='จบงาน รอชำระ'||b.status==='รอตรวจยอดคงเหลือ')) sheet.appendChild(settleBox(b));
    if(!isNew&&can('finish')&&b.status==='ยืนยันคิว'&&b.date<=S.data.today) sheet.appendChild(finishBox(b));
    if(!isNew) sheet.appendChild(el('div',{class:'actions',style:'margin-bottom:12px'},[el('button',{class:'btn',type:'button',text:'ใบงานหน้างาน',onclick:function(){ jobSheet(b); }}),el('span')]));
    if(!isNew) sheet.appendChild(onlineBox(b));
    sheet.appendChild(el('fieldset',{},[ el('legend',{text:'วันและบริการ'}), el('div',{class:'f'},[
      lab('วันงาน',inp('date','date')), lab('รอบ',sel('slot',L.slots)),
      lab('เวลาเริ่ม',inp('start','time')), lab('เวลาสิ้นสุด',inp('end','time')),
      lab('บริการ',sel('service',L.services),true),
      lab('ชั่วโมง',sel('hours',[2,3,4,5,6,7,8])), lab('รูปแบบภาพ',sel('print',['2x6','4x6','ไม่พิมพ์','-'])),
      lab('ฉาก',inp('backdrop','text',{list:'bd',placeholder:'ครีม / เทาเข้ม'})), el('label',{class:'check'},[wishes,'เขียนคำอวยพร 2x6']),
      backdropHint ]) ]));
    sheet.appendChild(el('datalist',{id:'bd'},[el('option',{value:'ครีม'}),el('option',{value:'เทาเข้ม'})]));
    sheet.appendChild(el('fieldset',{},[ el('legend',{text:'ลูกค้าและสถานที่'}), el('div',{class:'f'},[
      lab('ชื่อลูกค้า',inp('customer','text',{autocomplete:'off'}),true),
      lab('เบอร์โทร',inp('phone','tel',{inputmode:'tel'})), lab('Facebook / LINE',inp('contact')),
      lab('อีเมล',inp('email','email'),true),
      lab('ประเภทงาน',sel('eventType',['งานแต่ง','งานบวช','วันเกิด','องค์กร','โรงเรียน','อื่นๆ'])), lab('พื้นที่',sel('area',L.areas)),
      lab('สถานที่',inp('venue'),true) ]) ]));
    if(money) sheet.appendChild(el('fieldset',{},[ el('legend',{text:'ราคาและมัดจำ'}), el('div',{class:'f'},[
      qline,
      lab('ราคาแพ็กเกจ',inp('price','number',{inputmode:'numeric',min:0})), lab('ค่าเดินทาง',inp('travel','number',{inputmode:'numeric',min:0})),
      lab('ค่าเพิ่มอื่น',inp('extra','number',{inputmode:'numeric',min:0})), lab('ยอดรวม',inp('total','number',{inputmode:'numeric',min:0})),
      lab('มัดจำ (แก้ได้)',inp('deposit','number',{inputmode:'numeric',min:0})), lab('สถานะเงิน',sel('payStatus',L.pay)) ]) ]));
    var flag=function(k,text){ var c=el('input',{type:'checkbox'}); c.checked=!!b[k]; if(ro) c.disabled=true; F[k]={type:'flag',get value(){ return c.checked?'ใช่':''; }}; return el('label',{class:'check full'},[c,text]); };
    sheet.appendChild(el('fieldset',{},[ el('legend',{text:'สถานะและหมายเหตุ'}), el('div',{class:'f'},[
      lab('สถานะคิว',sel('status',L.status)), lab('ที่มา / ผู้ดีล',inp('source')), lab('หมายเหตุ',note,true) ]) ]));
    if(!isNew) sheet.appendChild(el('fieldset',{},[ el('legend',{text:'ติดตามงาน'}), el('div',{class:'f'},[ lab('งานออกแบบเทมเพลต',sel('designStatus',L.design),true), flag('filesSent','ส่งไฟล์ให้ลูกค้าแล้ว'), flag('reviewAsked','ขอรีวิวจากลูกค้าแล้ว'), flag('posted','โพสต์ผลงานลงเพจแล้ว') ]) ]));
    sheet.appendChild(out);
    if(!ro){
      var save=el('button',{class:'btn primary',type:'button',text:'บันทึก'});
      var submit=function(extra){ var o=cur(); Object.keys(extra||{}).forEach(function(k){ o[k]=extra[k]; });
        save.disabled=true; save.textContent='กำลังบันทึก…'; out.innerHTML='';
        api('adminSave',S.token,o).then(function(r){ $('dlg').close(); refresh((o.status==='ยกเลิก'?'ยกเลิกคิว ':'บันทึกคิว ')+r.id+' แล้ว'); })
          .catch(function(e){ save.disabled=false; save.textContent='บันทึก'; out.appendChild(el('div',{class:'msg bad',text:errText(e)})); out.scrollIntoView({block:'nearest'}); }); };
      save.onclick=function(){ if(money&&isNew&&F.total.value===''){ showQuote(true); } submit(); };
      var cancelBtn=(!isNew&&b.status!=='ยกเลิก')?el('button',{class:'btn danger',type:'button',text:'ยกเลิกคิวนี้',onclick:function(){ if(confirm('ยกเลิกคิว '+b.id+' ของ '+b.customer+' ใช่ไหม คิวจะกลับเป็นว่าง')) submit({status:'ยกเลิก'}); }}):el('span');
      sheet.appendChild(el('div',{class:'actions'},[cancelBtn,save]));
      ['service','hours','print','area'].forEach(function(k){ F[k].onchange=function(){ showQuote(false); hint(); }; }); wishes.onchange=function(){ showQuote(false); };
      F.slot.onchange=function(){};
    }
    showQuote(false); hint();
    $('dlg').showModal();
  }

  /* ---------- start ---------- */
  var saved=store.get();
  if(saved){ try{ var r=JSON.parse(saved); S.me=r; S.token=r.token; S.lists=r.lists; refresh(); }catch(e){ loginView(); } } else loginView();
})();
</script>
</body>
</html>

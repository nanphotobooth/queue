<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nan Photo Booth · จองคิว</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Arapey:ital@0;1&family=IBM+Plex+Sans+Thai:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#fbf7ee;--card:#fff;--ink:#1f1b16;--muted:#6f675c;--line:#e9e1d2;--brand:#f2b632;--free:#2f7d4f;--free-bg:#e6f4ea;--pend:#a35a00;--pend-bg:#fdecc8;--full:#8a8378;--full-bg:#eeeae2;--bad:#a1321f;--bad-bg:#fde8e4}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:'IBM Plex Sans Thai',system-ui,sans-serif;font-size:16px;line-height:1.55;-webkit-text-size-adjust:100%}
.wrap{max-width:560px;margin:0 auto;padding:18px 16px 64px}
header{text-align:center;padding:4px 0 2px}
header img{width:132px;height:auto;display:block;margin:0 auto 6px}
h1{font-family:'Arapey',serif;font-weight:400;font-size:28px;line-height:1.15;margin:0}
h2{font-family:'Arapey',serif;font-weight:400;font-size:22px;margin:0 0 10px}
h3{font-size:15px;font-weight:600;margin:18px 0 8px}
.sub{color:var(--muted);margin:4px 0 0;font-size:15px}
section{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px 16px;margin-top:16px}
label{display:block;font-size:13px;color:var(--muted);margin-bottom:12px}
label>span{display:block;margin-bottom:4px}
label .req{color:var(--bad)}
input,select,textarea{font:inherit;color:var(--ink);width:100%;min-height:48px;border:1px solid var(--line);border-radius:10px;padding:9px 12px;background:#fff}
textarea{min-height:84px;resize:vertical}
input:focus,select:focus,textarea:focus,button:focus-visible,a:focus-visible{outline:2px solid var(--ink);outline-offset:1px}
.row{display:grid;grid-template-columns:1fr 1fr;gap:0 10px}
.check{display:flex;gap:10px;align-items:flex-start;font-size:15px;color:var(--ink);margin-bottom:12px}
.check input{width:22px;min-height:22px;height:22px;flex:none;margin-top:2px}
.btn{display:flex;align-items:center;justify-content:center;width:100%;min-height:50px;border-radius:12px;font:inherit;font-weight:600;text-decoration:none;border:1px solid var(--ink);color:var(--ink);background:#fff;padding:0 16px;cursor:pointer;text-align:center}
.btn.primary{background:var(--ink);color:#fff}
.btn:disabled{opacity:.5;cursor:default}
.btns{display:grid;gap:8px;margin-top:14px}
.btns.two{grid-template-columns:1fr 2fr}
.link{border:0;background:none;font:inherit;color:var(--ink);text-decoration:underline;cursor:pointer;padding:8px 0}
.msg{border-radius:12px;padding:11px 13px;font-size:14px;margin:12px 0}
.msg.bad{background:var(--bad-bg);color:var(--bad)} .msg.ok{background:var(--free-bg);color:var(--free)} .msg.warn{background:var(--pend-bg);color:var(--pend)} .msg.info{background:var(--full-bg);color:var(--ink)}
.hint{font-size:13px;color:var(--muted);margin:-6px 0 12px}
.steps{display:flex;gap:6px;margin:14px 0 2px}
.steps i{flex:1;height:4px;border-radius:2px;background:var(--line)}
.steps i.on{background:var(--ink)}
.kv{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
.kv td{padding:7px 0;border-bottom:1px solid var(--line);font-size:15px;vertical-align:top}
.kv td:last-child{text-align:right;font-weight:500}
.kv tr.total td{font-weight:600;font-size:17px;border-bottom:0}
.kv td:first-child{color:var(--muted);padding-right:12px;white-space:nowrap}
.big{font-size:34px;font-weight:600;font-variant-numeric:tabular-nums;line-height:1.1}
.center{text-align:center}
.timer{font-variant-numeric:tabular-nums;font-weight:600}
.qr{display:block;width:100%;max-width:300px;margin:12px auto;border-radius:14px;border:1px solid var(--line)}
.copy{display:flex;justify-content:space-between;align-items:center;gap:10px;background:var(--full-bg);border-radius:12px;padding:10px 12px;margin-top:8px}
.copy button{border:1px solid var(--ink);background:#fff;border-radius:8px;font:inherit;font-size:13px;padding:6px 10px;cursor:pointer;min-height:36px}
.chip{display:inline-block;font-size:13px;font-weight:600;border-radius:999px;padding:3px 11px}
.chip.ok{background:var(--free-bg);color:var(--free)} .chip.warn{background:var(--pend-bg);color:var(--pend)} .chip.off{background:var(--full-bg);color:var(--full)} .chip.bad{background:var(--bad-bg);color:var(--bad)}
details{border-top:1px solid var(--line);padding:10px 0}
details summary{cursor:pointer;font-weight:500}
details ol{padding-left:20px;font-size:14px;color:var(--muted)}
details h4{margin:12px 0 2px;font-size:14px}
footer{text-align:center;color:var(--muted);font-size:13px;margin-top:20px}
footer a{color:inherit}
@media print{body{background:#fff}.noprint{display:none!important}section{border:0;padding:0}.wrap{max-width:none;padding:0}}

</style>
</head>

var readFile=function(file,asImage){
  return new Promise(function(res,rej){
    if(!file) return rej(new Error('ยังไม่ได้เลือกไฟล์'));
    if(file.size>12*1024*1024) return rej(new Error('ไฟล์ใหญ่เกินไป'));
    var fr=new FileReader();
    fr.onerror=function(){ rej(new Error('อ่านไฟล์ไม่สำเร็จ')); };
    fr.onload=function(){
      var url=fr.result;
      if(file.type==='application/pdf'&&!asImage){ if(file.size>5*1024*1024) return rej(new Error('ไฟล์ PDF ต้องไม่เกิน 5 MB')); return res({mime:'application/pdf',data:String(url).split(',')[1]}); }
      if(!/^image\//.test(file.type)) return rej(new Error(asImage?'กรุณาเลือกไฟล์รูปภาพ':'รองรับเฉพาะรูปภาพหรือ PDF'));
      var img=new Image();
      img.onerror=function(){ rej(new Error('เปิดรูปนี้ไม่ได้ ลองบันทึกเป็น JPG แล้วส่งใหม่')); };
      img.onload=function(){ var m=1600, k=Math.min(1,m/Math.max(img.width,img.height)), c=document.createElement('canvas'); c.width=Math.round(img.width*k); c.height=Math.round(img.height*k);
        var g=c.getContext('2d'); g.fillStyle='#fff'; g.fillRect(0,0,c.width,c.height); g.drawImage(img,0,0,c.width,c.height); res({mime:'image/jpeg',data:c.toDataURL('image/jpeg',0.85).split(',')[1]}); };
      img.src=url;
    };
    fr.readAsDataURL(file);
  });
};

        try{ sessionStorage.setItem('npb_b',JSON.stringify({id:b.id,last4:last4})); }catch(e){}
        var go=function(){ location.href='status.html?id='+encodeURIComponent(b.id); };
        if(cardFile){ bookBtn.textContent='กำลังส่งการ์ดเชิญ…'; readFile(cardFile,false).then(function(f){ return api('bookingCard',b.id,last4,f); }).then(go,go); } else go();
      }).catch(function(e){ busy(false,{btn:bookBtn,text:'จองคิวและไปหน้าชำระมัดจำ'}); monthCache={}; out.appendChild(el('div',{class:'msg bad',text:errText(e)})); });
    };
    quoteBtn.onclick=function(){
      if(!F.consentData) return step4('กรุณาติ๊กยินยอมการเก็บข้อมูลก่อนขอใบเสนอราคา');
      busy(true,{btn:quoteBtn,text:'กำลังส่งใบเสนอราคา…'}); out.innerHTML='';
      api('quoteRequest',payload()).then(function(b){
        setSteps(5); view.innerHTML=''; var s=el('section',{class:'center'}); view.appendChild(s);
        s.appendChild(el('h2',{text:'ส่งใบเสนอราคาแล้ว'})); s.appendChild(el('p',{text:'เลขที่ '+b.id+' ส่งไปที่ '+b.email}));
        s.appendChild(el('div',{class:'msg warn',text:'ใบเสนอราคายังไม่ได้กันคิวให้ คิวอาจมีผู้อื่นจองไปก่อน'}));
        s.appendChild(el('div',{class:'btns'},[ el('a',{class:'btn primary',href:'status.html?id='+encodeURIComponent(b.id),text:'ดูใบเสนอราคา',onclick:function(){ try{ sessionStorage.setItem('npb_b',JSON.stringify({id:b.id,last4:F.phone.replace(/\D/g,'').slice(-4)})); }catch(e){} }}), el('button',{class:'btn',type:'button',text:'กลับไปจองคิวนี้เลย',onclick:function(){ step4(); }}) ]));
        window.scrollTo(0,0);
      }).catch(function(e){ busy(false,{btn:quoteBtn,text:'ยังไม่จอง ขอใบเสนอราคาทางอีเมล'}); out.appendChild(el('div',{class:'msg bad',text:errText(e)})); });
    };
    sec.appendChild(out);
    sec.appendChild(el('p',{class:'hint',style:'margin:10px 0 0',text:'เมื่อกดจอง ระบบจะกันคิวให้ '+init.holdMinutes+' นาที เพื่อให้โอนมัดจำและแนบสลิป'}));
    sec.appendChild(el('div',{class:'btns'},[bookBtn,quoteBtn,el('button',{class:'link',type:'button',text:'ย้อนกลับไปแก้ไข',onclick:function(){ step3(); }})]));
    window.scrollTo(0,0);
  }

  api('publicInit').then(function(r){ init=r; if(F.date&&!/^\d{4}-\d{2}-\d{2}$/.test(F.date)) F.date=''; if(['เช้า','เย็น'].indexOf(F.slot)<0) F.slot=''; step1(); })
    .catch(function(e){ view.innerHTML=''; view.appendChild(el('section',{},[el('div',{class:'msg bad',text:'เปิดระบบไม่สำเร็จ กรุณาลองใหม่อีกครั้ง'})])); });
})();
</script>
</body>
</html>

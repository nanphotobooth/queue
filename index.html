<!DOCTYPE html>
<html lang="th">
<head>
<base target="_top">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nan Photo Booth · เช็กคิวว่าง</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Arapey:ital@0;1&family=IBM+Plex+Sans+Thai:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#fbf7ee; --card:#ffffff; --ink:#1f1b16; --muted:#6f675c; --line:#e9e1d2;
    --brand:#f2b632; --brand-soft:#fdf0cf; --free:#2f7d4f; --free-bg:#e6f4ea;
    --pend:#a35a00; --pend-bg:#fdecc8; --full:#8a8378; --full-bg:#eeeae2; --sage:#7f9b5c;
  }
  *{box-sizing:border-box}
  html,body{margin:0}
  body{background:var(--bg);color:var(--ink);font-family:'IBM Plex Sans Thai',system-ui,sans-serif;font-size:16px;line-height:1.55;-webkit-text-size-adjust:100%}
  .wrap{max-width:560px;margin:0 auto;padding:20px 16px 56px}
  header{text-align:center;padding:8px 0 4px}
  header img{width:168px;height:auto;display:block;margin:0 auto 10px}
  h1{font-family:'Arapey',serif;font-weight:400;font-size:30px;line-height:1.15;margin:0}
  h2{font-family:'Arapey',serif;font-weight:400;font-size:24px;margin:0 0 4px}
  .sub{color:var(--muted);margin:6px 0 0}
  .by{font-family:'Arapey',serif;font-style:italic;color:var(--muted);white-space:nowrap}
  section{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px 16px;margin-top:18px}
  .monthbar{display:flex;align-items:center;justify-content:space-between;margin:10px 0 12px}
  .monthbar strong{font-size:18px;font-weight:600}
  .nav{width:44px;height:44px;border-radius:50%;border:1px solid var(--line);background:#fff;font-size:20px;color:var(--ink);cursor:pointer}
  .nav:disabled{opacity:.3;cursor:default}
  .grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
  .dow{font-size:12px;color:var(--muted);text-align:center;padding:2px 0 6px}
  .day{position:relative;border:1px solid transparent;border-radius:12px;background:transparent;padding:6px 0 7px;min-height:58px;font:inherit;color:inherit;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:5px}
  .day .n{font-size:15px;font-weight:500;line-height:1}
  .day .pips{display:flex;gap:3px}
  .pip{width:14px;height:8px;border-radius:4px;background:var(--free)}
  .pip.P{background:var(--brand)}
  .pip.F,.pip.C{background:#cfc8bb}
  .day.past{color:#b9b2a6;cursor:default}
  .day.past .pips{visibility:hidden}
  .day.today .n{text-decoration:underline;text-underline-offset:4px}
  .day.sel{border-color:var(--ink);background:#fff}
  .day.allfull .n{color:var(--full);text-decoration:line-through}
  .legend{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:13px;color:var(--muted);margin-top:12px}
  .legend span{display:inline-flex;align-items:center;gap:6px}
  .detail{margin-top:14px;border-top:1px solid var(--line);padding-top:14px}
  .detail h3{margin:0 0 10px;font-size:17px;font-weight:600}
  .slot{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 12px;border-radius:12px;margin-bottom:8px}
  .slot small{display:block;color:var(--muted);font-size:13px}
  .slot.A{background:var(--free-bg)} .slot.P{background:var(--pend-bg)} .slot.F,.slot.C{background:var(--full-bg)}
  .tag{font-weight:600;font-size:14px;white-space:nowrap}
  .slot.A .tag{color:var(--free)} .slot.P .tag{color:var(--pend)} .slot.F .tag,.slot.C .tag{color:var(--full)}
  .note{font-size:14px;color:var(--muted);margin:8px 0 0}
  .btn{display:flex;align-items:center;justify-content:center;min-height:48px;border-radius:12px;font:inherit;font-weight:600;text-decoration:none;border:1px solid var(--ink);color:var(--ink);background:#fff;padding:0 16px;cursor:pointer}
  .btn.primary{background:var(--ink);color:#fff}
  .btns{display:grid;gap:8px;margin-top:12px}
  .seg{display:flex;background:var(--full-bg);border-radius:12px;padding:4px;margin:12px 0}
  .seg button{flex:1;border:0;background:transparent;font:inherit;font-weight:500;padding:9px 4px;border-radius:9px;color:var(--muted);cursor:pointer}
  .seg button.on{background:#fff;color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08)}
  table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
  th,td{padding:9px 6px;text-align:right;border-bottom:1px solid var(--line);font-size:15px}
  th{font-weight:500;color:var(--muted);font-size:13px}
  th:first-child,td:first-child{text-align:left}
  ul{margin:10px 0 0;padding-left:20px;color:var(--muted);font-size:14px}
  .gfx{display:grid;gap:10px;margin:4px 0 14px}
  .gfx a{display:block;border-radius:14px;overflow:hidden;border:1px solid var(--line)}
  .gfx img{display:block;width:100%;height:auto;aspect-ratio:1/1;background:var(--full-bg)}
  .loading{color:var(--muted);text-align:center;padding:26px 0}
  .err{background:#fde8e4;color:#8a2c1b;border-radius:12px;padding:12px;font-size:14px}
  footer{text-align:center;color:var(--muted);font-size:13px;margin-top:22px}
  footer a{color:inherit}
</style>
</head>

    <h1>เช็กคิวว่าง</h1>
    <p class="sub">Photo Booth และ Video Guestbook <span class="by">By Nan Photo Booth</span></p>
  </header>

  <section aria-label="ปฏิทินคิวงาน">
    <div class="monthbar">
      <button class="nav" id="prev" aria-label="เดือนก่อนหน้า">‹</button>

    </div>

<script>
(function(){
  var API_URL='https://script.google.com/macros/s/AKfycbyCAvIIJm0up-Vw__TMI_vYmZQDSFoYVO8dHcTXpHEz85LMMGcdKXrUvl90vVxhCASAEQ/exec';
  var api=function(fn){
    var args=[].slice.call(arguments,1);
    if(window.google&&google.script&&google.script.run){
      return new Promise(function(res,rej){ var r=google.script.run.withSuccessHandler(res).withFailureHandler(function(e){ rej(e); }); r[fn].apply(r,args); });
    }
    return fetch(API_URL,{method:'POST',credentials:'omit',redirect:'follow',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({fn:fn,args:args})})
      .then(function(r){ if(!r.ok) throw new Error('เชื่อมต่อระบบไม่สำเร็จ ('+r.status+')'); return r.json(); })
      .then(function(j){ if(!j.ok) throw new Error(j.error); return j.data; });
  };
  var $ = function(id){ return document.getElementById(id); };
  var el = function(tag,cls,text){ var e=document.createElement(tag); if(cls) e.className=cls; if(text!=null) e.textContent=text; return e; };
  var MONTHS=['มกราคม','กุมภาพันธ์','มีนาคม','เมษายน','พฤษภาคม','มิถุนายน','กรกฎาคม','สิงหาคม','กันยายน','ตุลาคม','พฤศจิกายน','ธันวาคม'];
  var DOW=['อา','จ','อ','พ','พฤ','ศ','ส'];
  var LABEL={A:'ว่าง',P:'รอยืนยัน',F:'เต็ม',C:'ปิดรับงาน'};
  var init=null, cur=null, cache={}, sel=null, tab='pb';
  var fmt=function(n){ return Number(n).toLocaleString('en-US'); };
  var pad=function(n){ return ('0'+n).slice(-2); };
  var ymOf=function(y,m){ return y+'-'+pad(m); };
  var addDays=function(iso,n){ var p=iso.split('-'); return new Date(Date.UTC(+p[0],+p[1]-1,+p[2]+n)).toISOString().slice(0,10); };

  DOW.forEach(function(d){ $('dow').appendChild(el('div','dow',d)); });

  function load(ym){
    if(cache[ym]) return Promise.resolve(cache[ym]);
    return api('publicMonth',ym).then(function(r){ cache[ym]=r.days; return r.days; });
  }

  function render(){
    var y=cur.y, m=cur.m, ym=ymOf(y,m);
    $('mtitle').textContent=MONTHS[m-1]+' '+(y+543);
    var first=ymOf(+init.today.slice(0,4),+init.today.slice(5,7));
    var lastD=new Date(Date.UTC(+init.today.slice(0,4),+init.today.slice(5,7)-1+init.monthsAhead,1));
    var last=ymOf(lastD.getUTCFullYear(),lastD.getUTCMonth()+1);
    $('prev').disabled = ym<=first; $('next').disabled = ym>=last;
    var box=$('days'); box.innerHTML=''; box.appendChild(el('div','loading','กำลังโหลดคิวงาน…')).style.gridColumn='1/-1';
    load(ym).then(function(days){
      if(ymOf(cur.y,cur.m)!==ym) return;
      box.innerHTML='';
      var start=new Date(Date.UTC(y,m-1,1)).getUTCDay();
      var n=new Date(Date.UTC(y,m,0)).getUTCDate();
      for(var i=0;i<start;i++) box.appendChild(el('div'));
      for(var d=1;d<=n;d++){
        (function(d){
          var iso=ym+'-'+pad(d), st=days[iso]||['A','A'];
          var b=el('button','day'); b.type='button';
          b.appendChild(el('span','n',d));
          var pips=el('span','pips'); pips.appendChild(el('i','pip '+st[0])); pips.appendChild(el('i','pip '+st[1])); b.appendChild(pips);
          var past=iso<init.today;
          if(past){ b.classList.add('past'); b.disabled=true; }
          if(iso===init.today) b.classList.add('today');
          if(!past && st[0]!=='A' && st[0]!=='P' && st[1]!=='A' && st[1]!=='P') b.classList.add('allfull');
          if(sel===iso) b.classList.add('sel');
          b.setAttribute('aria-label',d+' '+MONTHS[m-1]+' รอบเช้า'+LABEL[st[0]]+' รอบเย็น'+LABEL[st[1]]);
          b.onclick=function(){ sel=iso; render(); showDetail(iso,st); };
          box.appendChild(b);
        })(d);
      }
    }).catch(function(e){ box.innerHTML=''; var x=el('div','err','โหลดคิวงานไม่สำเร็จ กรุณาลองใหม่ หรือทักแชทเพจ'); x.style.gridColumn='1/-1'; box.appendChild(x); });
  }

  function showDetail(iso,st){
    var p=iso.split('-'), dt=new Date(Date.UTC(+p[0],+p[1]-1,+p[2]));
    var box=$('detail'); box.hidden=false; box.innerHTML='';
    box.appendChild(el('h3',null,['วันอาทิตย์','วันจันทร์','วันอังคาร','วันพุธ','วันพฤหัสบดี','วันศุกร์','วันเสาร์'][dt.getUTCDay()]+'ที่ '+(+p[2])+' '+MONTHS[+p[1]-1]+' '+(+p[0]+543)));
    [['รอบเช้า',init.slots.morning,st[0]],['รอบเย็น',init.slots.evening,st[1]]].forEach(function(r){
      var row=el('div','slot '+r[2]); var left=el('div'); left.appendChild(document.createTextNode(r[0]));
      left.appendChild(el('small',null,String(r[1]).replace('-','–')+' น.')); row.appendChild(left); row.appendChild(el('span','tag',LABEL[r[2]])); box.appendChild(row);
    });
    var anyFree=st.indexOf('A')>=0, anyPend=st.indexOf('P')>=0, soon=iso<addDays(init.today,init.leadDays);
    var msg = anyFree ? (soon ? 'วันงานใกล้มาก กรุณาทักแชทเพื่อเช็กกับทีมงานก่อนนะคะ' : (init.holdMinutes ? 'คิวยังว่าง จองออนไลน์และชำระมัดจำได้เลยค่ะ' : 'คิวยังว่าง ทักแชทเพจเพื่อจองคิวได้เลยค่ะ'))
            : anyPend ? 'มีลูกค้ารอยืนยันคิวอยู่ ทักแชทเพื่อเข้าคิวสำรองได้ค่ะ' : 'วันนี้คิวเต็มแล้ว ลองเลือกวันอื่น หรือทักแชทสอบถามได้ค่ะ';
    box.appendChild(el('p','note',msg));
    var btns=el('div','btns');
    var online=!!init.holdMinutes;
    if(online&&anyFree&&!soon){ var bk=el('a','btn primary','จองคิววันนี้ออนไลน์'); bk.href='book.html?date='+iso+(st[0]==='A'&&st[1]!=='A'?'&slot=เช้า':st[1]==='A'&&st[0]!=='A'?'&slot=เย็น':''); btns.appendChild(bk); }
    var a=el('a',(online&&anyFree&&!soon)?'btn':'btn primary',(!online&&anyFree)?'จองคิววันนี้ทางแชทเพจ':'สอบถามทางแชทเพจ'); a.href=init.shop.messenger; a.target='_blank'; a.rel='noopener'; btns.appendChild(a);
    box.appendChild(btns);
    box.appendChild(el('p','note','โทร '+init.shop.phones));
    box.scrollIntoView({behavior:'smooth',block:'nearest'});
  }

  function renderPrices(){
    var box=$('prices'); box.innerHTML='';
    var gfx=el('div','gfx');
    (tab==='pb' ? [['g-pb-detail.jpg','รายละเอียดบริการ Photo Booth'],['g-pb-price.jpg','ตารางราคา Photo Booth']] : [['g-vgb-detail.jpg','รายละเอียดบริการ Video Guestbook'],['g-vgb-price.jpg','ตารางราคา Video Guestbook']]).forEach(function(g){
      var a=el('a'); a.href=g[0]; a.target='_blank'; a.rel='noopener'; var im=el('img'); im.src=g[0]; im.alt=g[1]; im.loading='lazy'; im.width=1080; im.height=1080; a.appendChild(im); gfx.appendChild(a); });
    box.appendChild(gfx);
    var t=el('table'), h=el('tr');
    var heads = tab==='pb' ? ['ชั่วโมง','ไม่พิมพ์ภาพ','พิมพ์ 2x6 นิ้ว','พิมพ์ 4x6 นิ้ว'] : ['ชั่วโมง','Video Guestbook','คู่กับ Photo Booth 2x6'];
    heads.forEach(function(x){ h.appendChild(el('th',null,x)); }); t.appendChild(h);
    init.prices.forEach(function(r){
      var tr=el('tr'); tr.appendChild(el('td',null,r[0]+' ชั่วโมง'));
      (tab==='pb'?[r[1],r[2],r[3]]:[r[4],r[5]]).forEach(function(v){ tr.appendChild(el('td',null,fmt(v))); });
      t.appendChild(tr);
    });
    box.appendChild(t);
    var ul=el('ul');
    var notes = tab==='pb'
      ? ['ฉากกว้าง 2.7 เมตร พร็อพ ไฟสตูดิโอ และทีมงานดูแลตลอดงาน','ออกแบบเทมเพลตให้เข้ากับธีมงาน ฟรี 1 แบบ','รับไฟล์ภาพหน้างานทาง AirDrop หรือ QR Code','เขียนคำอวยพรขนาด 2x6 นิ้ว เพิ่ม '+fmt(init.fees.wishesFee)+' บาท แถมอัลบั้มใส่ภาพ']
      : ['ยกหู พูดอวยพร แล้ววาง ใช้ง่ายทุกวัย','รับไฟล์วิดีโอทาง Google Drive','จองคู่กับ Photo Booth แบบ 4x6 หรือไม่พิมพ์ภาพ ลด '+fmt(init.fees.bundleDiscountOther)+' บาทจากราคารวม'];
    notes.push('ค่าเดินทาง: อ.เมืองน่าน ไม่มี · ต่างอำเภอในน่าน '+fmt(init.fees.travelDistrict)+' บาท · ต่างจังหวัด สอบถามทางแชท');
    notes.forEach(function(x){ ul.appendChild(el('li',null,x)); }); box.appendChild(ul);
  }

  $('prev').onclick=function(){ cur.m--; if(cur.m<1){cur.m=12;cur.y--;} sel=null; $('detail').hidden=true; render(); };
  $('next').onclick=function(){ cur.m++; if(cur.m>12){cur.m=1;cur.y++;} sel=null; $('detail').hidden=true; render(); };
  [].forEach.call($('seg').children,function(b){ b.onclick=function(){ tab=b.dataset.t; [].forEach.call($('seg').children,function(x){ x.classList.toggle('on',x===b); }); renderPrices(); }; });

  api('publicInit').then(function(r){
    init=r; cur={y:+r.today.slice(0,4),m:+r.today.slice(5,7)};
    render(); renderPrices(); if(r.holdMinutes) $('foot2').hidden=false;
    var f=$('foot'); f.textContent='';
    [['Facebook',r.shop.facebook],['Instagram',r.shop.instagram]].forEach(function(l,i){ if(!l[1]) return; if(i) f.appendChild(document.createTextNode(' · ')); var a=el('a',null,l[0]); a.href=l[1]; a.target='_blank'; a.rel='noopener'; f.appendChild(a); });
  }).catch(function(e){
    $('days').innerHTML=''; var x=el('div','err','เปิดระบบไม่สำเร็จ กรุณาลองใหม่อีกครั้ง'); x.style.gridColumn='1/-1'; $('days').appendChild(x); $('prices').innerHTML='';
  });
})();
</script>
</body>
</html>
